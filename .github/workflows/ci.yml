# Runs our checks on every pull request, so broken code shows a red X before
# anyone merges it. Uses no secrets: CI never sees any keys or passwords.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

# A new push to the same branch cancels its older run (saves free minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only needs to read the code.
permissions:
  contents: read

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Only the database is needed: a fresh one with all migrations applied.
      - run: npx supabase db start
      - run: npm run db:test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
